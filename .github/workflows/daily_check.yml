name: Continuous Portfolio Check

on:
  schedule:
    # S'exécute du lundi au vendredi à 18h30 UTC (après la clôture européenne)
    - cron: '30 18 * * 1-5'
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'interface GitHub

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Exécution de l'analyse
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_portfolio.py
