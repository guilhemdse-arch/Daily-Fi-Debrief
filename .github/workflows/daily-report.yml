name: Rapport quotidien portefeuille

on:
  schedule:
    # 20:15 UTC = 22:15 heure d'été à Paris (CEST, UTC+2) / 21:15 en hiver (CET, UTC+1).
    # GitHub Actions ne gère pas le changement d'heure automatiquement :
    # décale la valeur d'une heure toi-même si besoin selon la saison.
    - cron: "15 20 * * 1-5"
  workflow_dispatch: {}  # permet de lancer le workflow manuellement pour tester

permissions:
  contents: write
  
jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer et envoyer le rapport et l'envoyer sur Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_report.py

      - name: Committer l'historique mis à jour (docs/data.json)
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --quiet --cached || git commit -m "Mise à jour quotidienne $(date -u +%F)"
          git push
