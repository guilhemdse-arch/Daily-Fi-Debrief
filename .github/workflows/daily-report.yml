name: Rapport quotidien portefeuille

on:
  schedule:
    # Horaires en UTC. 16:45 UTC = 17:45 à Paris en hiver (après la clôture d'Euronext à 17:30).
    # En été (fin mars), passer à "45 15 * * 1-5" pour garder 17:45 heure de Paris.
    # Avant, le rapport tournait à 16:30 Paris en hiver, avant la clôture : les cours étaient incomplets.
    - cron: "45 16 * * 1-5"
  workflow_dispatch: {}  # permet de lancer le workflow manuellement pour tester

permissions:
  contents: write

concurrency:
  group: commit-docs
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer et envoyer le rapport et l'envoyer sur Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: "https://guilhemdse-arch.github.io/Daily-Fi-Debrief/"
        run: python daily_report.py

      - name: Committer l'historique mis à jour (docs/data.json)
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --quiet --cached && exit 0
          git commit -m "Mise à jour quotidienne $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
