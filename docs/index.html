<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Portefeuille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0C0E11;
    --surface: #16191D;
    --surface-2: #1D2126;
    --hairline: rgba(255,255,255,0.07);
    --text: #F1F2F4;
    --text-dim: #9BA1AB;
    --text-faint: #676D77;
    --green: #35D68C;
    --green-bg: rgba(53,214,140,0.14);
    --amber: #F2A93B;
    --amber-bg: rgba(242,169,59,0.14);
    --red: #F1596A;
    --red-bg: rgba(241,89,106,0.14);
    --ring-track: rgba(255,255,255,0.09);
    --radius-lg: 20px;
    --radius-md: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
  }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  .glow {
    position: absolute;
    top: -120px; left: 50%;
    width: 480px; height: 320px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(53,214,140,0.16), transparent);
    pointer-events: none;
    filter: blur(10px);
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 0; position: relative; }

  header { margin-bottom: 24px; }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }

  .subtitle { color: var(--text-dim); font-size: 13px; }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }

  .stat {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 14px 16px;
  }

  .stat .label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .stat .value { font-size: 22px; font-weight: 700; }
  .stat .value.green { color: var(--green); }
  .stat .value.amber { color: var(--amber); }
  .stat .value.red { color: var(--red); }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    flex: 1;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    background: var(--surface);
    color: var(--text-dim);
    border: none;
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: var(--text); color: var(--bg); }

  select.sort {
    background: var(--surface);
    color: var(--text-dim);
    border: none;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 13px;
    font-family: inherit;
    flex: 0 0 auto;
  }

  .list { display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    cursor: pointer;
  }

  .card-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ring-wrap {
    position: relative;
    width: 42px; height: 42px;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .ring-wrap svg { width: 42px; height: 42px; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--ring-track); stroke-width: 3.5; }
  .ring-progress {
    fill: none; stroke-width: 3.5; stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease;
  }
  .ring-progress.hold { stroke: var(--green); }
  .ring-progress.watch { stroke: var(--amber); }
  .ring-progress.sell { stroke: var(--red); }
  .ring-progress.na { stroke: var(--text-faint); }
  .ring-value {
    position: absolute; font-size: 11px; font-weight: 700; color: var(--text);
  }

  .card-id { flex: 1; min-width: 0; }
  .card-symbol { font-weight: 600; font-size: 15px; display: block; }
  .card-name {
    font-size: 12.5px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }

  .card-value { text-align: right; flex: 0 0 auto; }
  .card-price { font-weight: 600; font-size: 15px; display: block; }
  .card-change { font-size: 12.5px; display: block; }
  .card-change.up { color: var(--green); }
  .card-change.down { color: var(--red); }

  .card-footer {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px; padding-left: 54px;
  }

  .pill {
    font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    flex: 0 0 auto;
  }
  .pill.hold { color: var(--green); background: var(--green-bg); }
  .pill.watch { color: var(--amber); background: var(--amber-bg); }
  .pill.sell { color: var(--red); background: var(--red-bg); }
  .pill.na { color: var(--text-faint); background: var(--surface-2); }

  .card-flags {
    font-size: 12px; color: var(--text-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .card-detail {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
  }
  .card.open .card-detail { display: block; }

  .detail-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .detail-item { background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
  .detail-item .k { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .detail-item .v { font-size: 14px; font-weight: 600; }

  .empty-state {
    padding: 70px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  footer {
    max-width: 640px;
    margin: 32px auto 0;
    padding: 18px;
    font-size: 11.5px;
    color: var(--text-faint);
    text-align: center;
  }

  @media (min-width: 560px) {
    .stats { grid-template-columns: repeat(4, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <header>
    <h1>Portefeuille</h1>
    <div class="subtitle" id="generated-at">—</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <select class="sort" id="sort-select">
      <option value="score">Tri : Score</option>
      <option value="change">Tri : Variation</option>
      <option value="name">Tri : Nom</option>
    </select>
  </div>

  <div class="list" id="list"></div>

  <div id="empty" class="empty-state" style="display:none;"></div>
</div>

<footer>
  Made in Lot & Garonne by GSE. Score basé sur un mix décote + qualité.
</footer>

<script>
  const RING_R = 16;
  const RING_C = 2 * Math.PI * RING_R;

  const SIGNAL_CLASS = (signal) => {
    if (!signal) return 'na';
    if (signal.includes('Vendre')) return 'sell';
    if (signal.includes('Surveiller')) return 'watch';
    if (signal.includes('Conserver')) return 'hold';
    return 'na';
  };
  const SIGNAL_LABEL = (signal) => (signal ? signal.replace(/^[^\w]+/u, '').trim() : 'N/D');

  let rows = [];
  let activeFilter = 'all';
  let sortKey = 'score';
  const openCharts = {};

  function fmtNum(v, decimals = 2) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    return v.toLocaleString('fr-FR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function buildRows(data) {
    return Object.entries(data.tickers || {}).map(([symbol, t]) => {
      const hist = t.history || [];
      const last = hist[hist.length - 1] || {};
      return {
        symbol,
        name: t.name || symbol,
        close: last.close,
        change: last.day_change_pct,
        score: last.score,
        signal: last.signal,
        flags: last.flags || [],
        peRatio: last.pe_ratio,
        roePct: last.roe_pct,
        history: hist,
      };
    });
  }

  function renderStats(data, all) {
    const withScore = all.filter(r => typeof r.score === 'number');
    const avgScore = withScore.length ? Math.round(withScore.reduce((s, r) => s + r.score, 0) / withScore.length) : null;
    const sellCount = all.filter(r => SIGNAL_CLASS(r.signal) === 'sell').length;
    const watchCount = all.filter(r => SIGNAL_CLASS(r.signal) === 'watch').length;

    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="label">Titres suivis</div><div class="value">${all.length}</div></div>
      <div class="stat"><div class="label">Score moyen</div><div class="value">${avgScore ?? '—'}</div></div>
      <div class="stat"><div class="label">À surveiller</div><div class="value amber">${watchCount}</div></div>
      <div class="stat"><div class="label">À vendre</div><div class="value red">${sellCount}</div></div>
    `;

    const gen = data.generated_at ? new Date(data.generated_at) : null;
    document.getElementById('generated-at').textContent = gen
      ? 'Mis à jour le ' + gen.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
      : 'Pas encore mis à jour';
  }

  function renderChips(all) {
    const counts = { all: all.length, hold: 0, watch: 0, sell: 0 };
    all.forEach(r => { const c = SIGNAL_CLASS(r.signal); if (counts[c] !== undefined) counts[c]++; });

    const defs = [
      { key: 'all', label: 'Tous' },
      { key: 'hold', label: 'Conserver' },
      { key: 'watch', label: 'Surveiller' },
      { key: 'sell', label: 'Vendre' },
    ];

    const chips = document.getElementById('chips');
    chips.innerHTML = '';
    defs.forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'chip' + (activeFilter === d.key ? ' active' : '');
      btn.textContent = `${d.label} (${counts[d.key] ?? 0})`;
      btn.addEventListener('click', () => { activeFilter = d.key; renderAll(); });
      chips.appendChild(btn);
    });
  }

  function sortRows(list) {
    const sorted = [...list];
    if (sortKey === 'name') {
      sorted.sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortKey === 'change') {
      sorted.sort((a, b) => (b.change ?? -Infinity) - (a.change ?? -Infinity));
    } else {
      sorted.sort((a, b) => (b.score ?? -Infinity) - (a.score ?? -Infinity));
    }
    return sorted;
  }

  function ringMarkup(score, signalClass) {
    const pct = typeof score === 'number' ? Math.max(0, Math.min(100, score)) : 0;
    const offset = RING_C * (1 - pct / 100);
    return `
      <div class="ring-wrap">
        <svg viewBox="0 0 40 40">
          <circle class="ring-track" cx="20" cy="20" r="${RING_R}"></circle>
          <circle class="ring-progress ${signalClass}" cx="20" cy="20" r="${RING_R}"
            stroke-dasharray="${RING_C}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <span class="ring-value">${score ?? '—'}</span>
      </div>
    `;
  }

  function renderList(list) {
    const container = document.getElementById('list');
    container.innerHTML = '';

    list.forEach(r => {
      const signalClass = SIGNAL_CLASS(r.signal);
      const changeClass = (r.change ?? 0) >= 0 ? 'up' : 'down';
      const changeText = r.change === null || r.change === undefined
        ? '—' : (r.change >= 0 ? '+' : '') + fmtNum(r.change) + '%';

      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-row">
          ${ringMarkup(r.score, signalClass)}
          <div class="card-id">
            <span class="card-symbol">${r.symbol}</span>
            <span class="card-name">${r.name}</span>
          </div>
          <div class="card-value">
            <span class="card-price">${fmtNum(r.close)}</span>
            <span class="card-change ${changeClass}">${changeText}</span>
          </div>
        </div>
        <div class="card-footer">
          <span class="pill ${signalClass}">${SIGNAL_LABEL(r.signal)}</span>
          ${r.flags.length ? `<span class="card-flags">${r.flags.join(' · ')}</span>` : ''}
        </div>
        <div class="card-detail">
          <canvas height="130"></canvas>
          <div class="detail-meta">
            <div class="detail-item"><div class="k">PER</div><div class="v">${r.peRatio != null ? fmtNum(r.peRatio, 1) : '—'}</div></div>
            <div class="detail-item"><div class="k">ROE</div><div class="v">${r.roePct != null ? fmtNum(r.roePct, 1) + '%' : '—'}</div></div>
          </div>
        </div>
      `;

      const detail = card.querySelector('.card-detail');
      const canvas = card.querySelector('canvas');

      card.addEventListener('click', () => {
        const isOpen = card.classList.toggle('open');
        if (isOpen && !openCharts[r.symbol] && r.history.length > 1) {
          openCharts[r.symbol] = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: {
              labels: r.history.map(h => h.date),
              datasets: [
                {
                  label: 'Score', data: r.history.map(h => h.score),
                  borderColor: '#35D68C', backgroundColor: 'transparent',
                  yAxisID: 'y', tension: 0.3, pointRadius: 0,
                },
                {
                  label: 'Cours', data: r.history.map(h => h.close),
                  borderColor: '#9BA1AB', backgroundColor: 'transparent',
                  yAxisID: 'y1', tension: 0.3, pointRadius: 0,
                },
              ],
            },
            options: {
              responsive: true,
              interaction: { mode: 'index', intersect: false },
              scales: {
                x: { ticks: { color: '#676D77', maxTicksLimit: 5 }, grid: { color: 'rgba(255,255,255,0.06)' } },
                y: { position: 'left', min: 0, max: 100, ticks: { color: '#676D77' }, grid: { color: 'rgba(255,255,255,0.06)' } },
                y1: { position: 'right', ticks: { color: '#676D77' }, grid: { drawOnChartArea: false } },
              },
              plugins: { legend: { labels: { color: '#9BA1AB', font: { family: 'Inter' } } } },
            },
          });
        }
      });

      container.appendChild(card);
    });
  }

  function renderAll() {
    const filtered = activeFilter === 'all' ? rows : rows.filter(r => SIGNAL_CLASS(r.signal) === activeFilter);
    renderChips(rows);
    renderList(sortRows(filtered));
  }

  document.getElementById('sort-select').addEventListener('change', (e) => {
    sortKey = e.target.value;
    renderAll();
  });

  fetch('data.json?_=' + Date.now())
    .then(res => res.json())
    .then(data => {
      rows = buildRows(data);
      if (!rows.length) {
        document.getElementById('empty').style.display = 'block';
        document.getElementById('empty').textContent = 'Aucune donnée pour le moment — ce fichier sera rempli après le premier run du workflow GitHub Actions.';
        document.getElementById('stats').style.display = 'none';
        document.querySelector('.toolbar').style.display = 'none';
        return;
      }
      renderStats(data, rows);
      renderAll();
    })
    .catch(err => {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('empty').textContent = "Impossible de charger data.json (normal si tu ouvres ce fichier en local plutôt que via GitHub Pages).";
      document.getElementById('stats').style.display = 'none';
      document.querySelector('.toolbar').style.display = 'none';
      console.error(err);
    });
</script>
</body>
</html>
